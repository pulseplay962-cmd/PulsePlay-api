name: Repair API package lockfile

on:
  push:
    branches: [phase-1-store-analytics-fixes]

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-store-analytics-fixes
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile repair to development branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize API package lockfile"
            git push origin HEAD:phase-1-store-analytics-fixes
          fi
      - name: Verify clean install
        run: npm ci
      - name: Check API entry point syntax
        run: node --check server.js
      - name: Check monetization route syntax
        run: node --check routes/monetization.js
