name: Phase 1 API checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase-1-store-analytics-fixes]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check API entry point syntax
        run: node --check server.js
      - name: Check monetization route syntax
        run: node --check routes/monetization.js
