name: JARVIS API Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/pulseplay-jarvis-core]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests and syntax checks
        run: npm test
